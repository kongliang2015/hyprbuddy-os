# fuzzel 启动器配置（elarun）
[main]
font=JetBrainsMono Nerd Font:size=12
prompt="  "
icons-enabled=yes
terminal=kitty
lines=12
width=40
# 行高（px），菜单更舒展；[colors] 由 theme-next 每次重写，勿在此段外放颜色
line-height=28

[colors]
background=0a1626ff
text=d7e7f5ff
match=1e9bd8ff
selection=1b3d5fff
selection-text=d7e7f5ff
selection-match=2e9eaaff
border=0e7fa8ff

[border]
width=2
radius=10
