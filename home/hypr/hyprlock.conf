# hyprlock 锁屏配置（Kanagawa）。用 Super+L 触发。
source = @HOME@/.config/hypr/theme-hyprlock.conf
general {
    hide_cursor = true
}

background {
    path = @HOME@/Pictures/wallpapers/06-kanagawa-mountain.png
    color = rgba(31,31,40,1)
}

label {
    text = $TIME
    color = rgba(220,215,186,1)
    font_size = 64
    font_family = sans-serif
    position = 0, 200
}

input-field {
    size = 300, 50
    position = 0, 50
    inner_color = rgba(42,42,55,0.9)
    outer_color = rgba(126,156,216,1)
    font_color = rgba(220,215,186,1)
    dots_color = rgba(220,215,186,1)
    rounding = 10
    placeholder_text = Enter password
}
