# hyprlock 锁屏配置。配色变量默认 Kanagawa，由 theme-next 生成的
# theme-hyprlock.conf 覆盖（source 置于默认值之后，后定义覆盖先定义）。
# 注意：hyprlock 的 source 是追加语义，主题文件只能写变量、不能写控件块，
# 否则会多渲染一套 background/label/input-field（曾导致锁屏出现两个输入框）。
$hl_bg = rgba(16161Dff)
$hl_fg = rgba(DCD7BAff)
$hl_inner = rgba(16161De6)
$hl_outer = rgba(957FB8ff)
$hl_dots = rgba(DCD7BAff)
$hl_bgpath = @HOME@/Pictures/wallpapers/01-kanagawa.png
source = @HOME@/.config/hypr/theme-hyprlock.conf

general {
    hide_cursor = true
}

background {
    path = $hl_bgpath
    color = $hl_bg
}

label {
    text = $TIME
    color = $hl_fg
    font_size = 64
    font_family = sans-serif
    position = 0, 200
}

input-field {
    size = 300, 50
    position = 0, 50
    inner_color = $hl_inner
    outer_color = $hl_outer
    font_color = $hl_fg
    rounding = 10
    placeholder_text = Enter password
}
