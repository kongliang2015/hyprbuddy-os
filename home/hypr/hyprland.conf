# Hyprland 用户配置（Tokyo Night）
# 系统级 programs.hyprland 提供二进制与会话，由 SDDM 启动。
# 修改后按 Super+Shift+R 热重载（hyprctl reload）。

$mainMod = SUPER

# ── 启动项 ───────────────────────────────────────────────
exec-once = fcitx5        # 中文输入
exec-once = bash -c 'sleep 1; awww-daemon || swww-daemon'   # 壁纸守护（等显示器就绪）
exec-once = waybar        # 顶部状态栏（系统级）
exec-once = @HOME@/.local/bin/theme-next restore   # 应用已保存主题（awww 已起）
exec-once = mako          # 通知
exec-once = hypridle      # 空闲自动锁屏/熄屏
exec-once = hyprsunset    # 夜间色温守护
exec-once = systemctl --user start hyprpolkitagent   # polkit 认证代理（SDDM 主题切换等 GUI 提权依赖）
exec-once = swayosd-server # 音量/亮度 OSD
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ── 环境变量（NVIDIA）───────────────────────────────────
env = XCURSOR_SIZE,24
# GTK 全局暗色（GTK4/libadwaita 也遵守）
env = GTK_THEME,Adwaita:dark

# ── 输入 ─────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ── 常用快捷键 ───────────────────────────────────────────
bind = $mainMod, D, exec, fuzzel
bind = $mainMod, SPACE, exec, @HOME@/.local/bin/hypr-menu
bind = $mainMod, B, exec, firefox
bind = $mainMod, E, exec, thunar
bind = $mainMod SHIFT, T, exec, @HOME@/.local/bin/theme-next   # 切换主题
bind = $mainMod, M, exit
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, R, exec, hyprctl reload

# ── 窗口操作 ─────────────────────────────────────────────
bind = $mainMod, T, togglefloating
bind = $mainMod, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod ALT, left, resizeactive, -30 0
bind = $mainMod ALT, right, resizeactive, 30 0
bind = $mainMod ALT, up, resizeactive, 0 -30
bind = $mainMod ALT, down, resizeactive, 0 30

# ── 工作区 1-4 ───────────────────────────────────────────
# 持久工作区：即使为空也保留，让 waybar 固定显示 1-4
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
# 临时工作区（scratchpad）
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# ── 鼠标 ─────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── 截图（hyprshot）──────────────────────────────────────
bind = , PRINT, exec, hyprshot -m region
bind = SHIFT, PRINT, exec, hyprshot -m output
# 截图标注 / 取色 / 夜间模式 / 录屏 / 换壁纸
bind = $mainMod SHIFT, A, exec, @HOME@/.local/bin/screenshot-annotate
bind = $mainMod SHIFT, C, exec, hyprpicker -a
bind = $mainMod SHIFT, N, exec, @HOME@/.local/bin/night-mode
bind = $mainMod SHIFT, P, exec, @HOME@/.local/bin/record-toggle
bind = $mainMod SHIFT, W, exec, @HOME@/.local/bin/wallpaper-next

# ── 音量 / 亮度 / 媒体键 ─────────────────────────────────
bind = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bind = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# ── 外观（Tokyo Night）──────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    # 启动兜底值（与 theme-next 默认主题 Tokyo Night 一致；登录后由 theme-next 覆盖）
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(565f89aa)
    resize_on_border = true
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(00000099)
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    animation = windows, 1, 6, easeOutQuint
    animation = windowsIn, 1, 6, easeOutQuint, slide
    animation = windowsOut, 1, 6, easeInOutCubic, slide
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, easeOutQuint, slidefade
}

dwindle {
    force_split = 0
}

# 快捷键参考弹窗：浮动、居中、72% 尺寸
# Hyprland 0.55 语法：prop 用 match: 前缀，effect 必须显式取值。
# 旧写法（float class:...）在 0.55 不报错但静默失效（窗口不再浮动/居中/72%）。
windowrule = match:class ^(keybinds-popup)$, float true, center true, size monitor_w*0.72 monitor_h*0.72
windowrule = match:class ^(theme-picker)$, float true, center true, size monitor_w*0.92 monitor_h*0.55

# ── 超级菜单（Super+Space）：背景模糊 + 周围变暗 + 无动画 ──
# Hyprland 0.55 语法：匹配属性须带 match: 前缀，effect 须显式取值；
# 0.54 及以前的 "layerrule = blur, ns" 写法在 0.55 会报 invalid field。
# namespace 与 hypr-menu 的 fuzzel --namespace hypr-menu 对应；
# 不影响 Super+D 的应用启动器（fuzzel 默认 namespace launcher）。
layerrule = match:namespace hypr-menu, blur true, ignore_alpha 0.3
layerrule = match:namespace hypr-menu, dim_around true, no_anim true
# 通知半透明卡片 + 背景模糊（mako 的 layer namespace 为 notifications）
layerrule = match:namespace notifications, blur true, ignore_alpha 0.5

# 壁纸兜底：每次配置加载（含开机启动与 hyprctl reload）延时 1s 重设，
# 规避壁纸守护早于显示器就绪时首设失败导致壁纸图层丢失（桌面露出纯色底）。
exec = @HOME@/.local/bin/theme-next restore   # 重载后重新应用已保存主题（含壁纸兜底）

# 发行版生成的条件片段（亮度键 / agent 等），见 lib/ 与 home/default.nix
source = @HOME@/.config/hypr/extra.conf
