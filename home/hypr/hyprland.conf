# Hyprland 用户配置（Tokyo Night）
# 系统级 programs.hyprland 提供二进制与会话，由 SDDM 启动。
# 修改后按 Super+Shift+R 热重载（hyprctl reload）。

$mainMod = SUPER

# ── 启动项 ───────────────────────────────────────────────
exec-once = fcitx5        # 中文输入
exec-once = waybar        # 顶部状态栏（系统级）
exec-once = hyprpaper     # 壁纸
exec-once = mako          # 通知
exec-once = hypridle      # 空闲自动锁屏/熄屏
exec-once = hyprsunset    # 夜间色温守护
exec-once = swayosd-server # 音量/亮度 OSD
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ── 环境变量（NVIDIA）───────────────────────────────────
env = XCURSOR_SIZE,24

# ── 输入 ─────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ── 常用快捷键 ───────────────────────────────────────────
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, D, exec, fuzzel
bind = $mainMod, SPACE, exec, /home/leonard/.local/bin/hypr-menu
bind = $mainMod, B, exec, firefox
bind = $mainMod, E, exec, thunar
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, M, exit
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, R, exec, hyprctl reload

# ── 窗口操作 ─────────────────────────────────────────────
bind = $mainMod, T, togglefloating
bind = $mainMod, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod ALT, left, resizeactive, -30 0
bind = $mainMod ALT, right, resizeactive, 30 0
bind = $mainMod ALT, up, resizeactive, 0 -30
bind = $mainMod ALT, down, resizeactive, 0 30

# ── 工作区 1-10 ──────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
# 临时工作区（scratchpad）
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# ── 鼠标 ─────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── 截图（hyprshot）──────────────────────────────────────
bind = , PRINT, exec, hyprshot -m region
bind = SHIFT, PRINT, exec, hyprshot -m output
# 截图标注 / 取色 / 夜间模式 / 录屏 / 换壁纸
bind = $mainMod SHIFT, A, exec, /home/leonard/.local/bin/screenshot-annotate
bind = $mainMod SHIFT, C, exec, hyprpicker -a
bind = $mainMod SHIFT, N, exec, /home/leonard/.local/bin/night-mode
bind = $mainMod SHIFT, P, exec, /home/leonard/.local/bin/record-toggle
bind = $mainMod SHIFT, W, exec, /home/leonard/.local/bin/wallpaper-next

# ── 音量 / 亮度 / 媒体键 ─────────────────────────────────
bind = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bind = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bind = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# ── 外观（Tokyo Night）──────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7e9cd8ee) rgba(957fb8ee) 45deg
    col.inactive_border = rgba(2a2a37aa)
    resize_on_border = true
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(00000099)
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    animation = windows, 1, 6, easeOutQuint
    animation = windowsIn, 1, 6, easeOutQuint, slide
    animation = windowsOut, 1, 6, easeInOutCubic, slide
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, easeOutQuint, slidefade
}

dwindle {
    pseudotile = true
    force_split = 0
}

# 快捷键参考弹窗：浮动、居中、72% 尺寸
windowrulev2 = float, class:^(keybinds-popup)$
windowrulev2 = center, class:^(keybinds-popup)$
windowrulev2 = size 72% 72%, class:^(keybinds-popup)$

# 壁纸兜底：每次配置加载（含开机启动与 hyprctl reload）延时 1s 重设，
# 规避 hyprpaper 早于显示器就绪时首设失败导致壁纸图层丢失（桌面露出纯色底）。
exec = bash -c 'sleep 1 && hyprctl hyprpaper preload /home/leonard/Pictures/wallpaper-kanagawa.png && hyprctl hyprpaper wallpaper ,/home/leonard/Pictures/wallpaper-kanagawa.png'
