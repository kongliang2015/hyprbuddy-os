# kitty — elarun 主题（蓝紫冷色）
font_family      JetBrainsMono Nerd Font
font_size        11
background_opacity 0.92
window_padding_width 10
cursor_shape     beam

# 不记忆窗口尺寸。kitty 默认会记住上次的窗口状态（包括 maximized），
# 在平铺 WM 里表现为"新终端占满整个屏幕"而不是与已有窗口平分。
# 尺寸交给 Hyprland 的平铺器决定。
remember_window_size no

foreground #D7E7F5
background #0A1626
selection_background #1B3D5F
selection_foreground #D7E7F5
cursor #1E9BD8
cursor_text_color #0A1626

color0  #0A1626
color8  #4A5E72
color1  #C04A55
color9  #E05A66
color2  #4C9A6A
color10 #6FBF84
color3  #D9B45A
color11 #E8CC7A
color4  #0E7FA8
color12 #1E9BD8
